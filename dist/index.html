<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: min(1280px, 100vw, calc(100vh * 4 / 3));
      aspect-ratio: 4 / 3;
      flex: 0 0 auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-Bi7KO27Y.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="960"></canvas>
    <div id="ui-overlay"></div>
  </div>
</body>
</html>
